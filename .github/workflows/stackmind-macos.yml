name: Build VMark StackMind for Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - 'stackmind-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Build MCP sidecar
        working-directory: server/mcp
        run: |
          pnpm build
          node scripts/build-sidecar.js --target darwin-arm64
      - name: Build and package the app
        run: |
          test "$(uname -m)" = arm64
          pnpm tauri build --bundles app --config src-tauri/tauri.stackmind.conf.json
          app='src-tauri/target/release/bundle/macos/VMark StackMind.app'
          codesign --force --sign - --entitlements src-tauri/app-entitlements.plist "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" VMark-StackMind-macOS-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: VMark-StackMind-macOS-arm64
          path: VMark-StackMind-macOS-arm64.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'stackmind-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VMark-StackMind-macOS-arm64
      - name: Publish Apple Silicon download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" VMark-StackMind-macOS-arm64.zip --repo "$REPO" --clobber
          else
            gh release create "$TAG" VMark-StackMind-macOS-arm64.zip --repo "$REPO" --verify-tag \
              --title "VMark StackMind · $TAG" \
              --notes "Apple Silicon build with an editable document mind map. Unzip and open VMark StackMind.app. The app is ad-hoc signed."
          fi
